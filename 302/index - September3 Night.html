    iStudy Diagnostic System - Version 2.0
    Changelog v2.0:
    - Pre-computed Joker critical thinking evaluations in initial batch query:
      * Generated both 'joker_feedback_correct' and 'joker_feedback_incorrect' upfront during the initial batch analysis.
      * Completely eliminated live LLM evaluation calls (N requests saved) during Joker's critical thinking phase.
      * Instant 0ms response latency when the student provides their judgment.
    - Implemented dedicated "Agree" and "Disagree" action buttons for Joker's turn:
      * Replaces text typing during Joker phase to eliminate ambiguity, typos, and student input variation.

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion || { motion: (p) => <div {...p} />, AnimatePresence: (p) => p.children };
        const ReactMarkdown = window.ReactMarkdown?.default || window.ReactMarkdown;

        // Core and Fetch Logic
        window.Core = window.Core || {
            CleanResponseText: (data) => {
                const parts = data?.candidates?.[0]?.content?.parts || [];
                const cleanText = parts
                    .filter(part => !part.thought)
                    .map(part => part.text || '')
                    .join('')
                    .trim();
                return cleanText || parts[0]?.text || '';
            },
            UploadFile: async (file) => {
                console.log("Processing file:", file.name);
                return { fileId: "mock-" + Date.now(), fileName: file.name };
            },
            FetchChapterData: async (chapterNum) => {
                const paddedChapter = chapterNum.toString().padStart(2, '0');
                const questionsUrl = `https://raw.githubusercontent.com/Camilo-Mora/GEO302/main/main/ExamQuestions_${paddedChapter}.xlsx`;
                const transcriptUrl = `https://raw.githubusercontent.com/Camilo-Mora/GEO302/main/main/Transcript_Lecture_${paddedChapter}.txt`;

                try {
                    const qRes = await fetch(questionsUrl);
                    if (!qRes.ok) throw new Error(`Questions for Chapter ${paddedChapter} not found.`);
                    const qBuffer = await qRes.arrayBuffer();
                    const qData = new Uint8Array(qBuffer);
                    const workbook = XLSX.read(qData, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                    const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    const tRes = await fetch(transcriptUrl);
                    let transcript = "No transcript available.";
                    if (tRes.ok) {
                        transcript = await tRes.text();
                    }

                    return {
                        questions: rawRows
                            .filter(row => row && row.length >= 2 && row[1] && row[1].toString().trim().length > 0)
                            .map((row) => ({
                                question_number: row[0] || "N/A",
                                question_text: row[1].toString().trim(),
                                timestamp: row[2] ? row[2].toString().trim() : null
                            })),
                        transcript: transcript
                    };
                } catch (err) {
                    console.error("Fetch Error:", err);
                    throw err;
                }
            },
            ExtractDataFromUploadedFile: async (file) => {
                try {
                    let text = '';
                    if (file.type.startsWith('image/')) {
                        const worker = await Tesseract.createWorker('eng', 1);
                        const { data } = await worker.recognize(file);
                        text = data.text;
                        await worker.terminate();
                    } else {
                        text = await file.text();
                    }

                    const lines = text.split('\n').filter(l => l.trim().length > 5);

                    const chapterMatch = text.match(/(?:chapter|chap|unit|lecture)\s*[:.-]?\s*(\d+)/i);
                    return {
                        detected_chapter: chapterMatch ? chapterMatch[1] : null,
                        full_text: text,
                        transcribed_responses: lines
                    };
                } catch (err) {
                    console.error("Extraction Error:", err);
                    throw new Error("Failed to read content from file.");
                }
            },
            SmartParseResponses: async (rawText, expectedCount, chapterNum) => {
                const prompt = `
                    I have the following raw text extracted from a student's answer sheet for Chapter ${chapterNum}.
                    The chapter has ${expectedCount} questions total.
                    
                    Raw Text:
                    """${rawText}"""

                    Task:
                    1. Identify ALL individual answers present in the text.
                    2. Merge multi-line answers into single strings.
                    3. Ignore question text if repeated, headers, or footers.
                    4. Return ONLY the answers you actually find - do NOT make up or pad responses if some are missing.
                    5. Output STRICTLY a valid JSON array of strings (e.g., ["Ans 1", "Ans 2"]). Do NOT use Markdown code blocks.
                    
                    IMPORTANT: Return only the responses that are actually present in the text. If there are fewer responses than ${expectedCount}, that's okay - just return what you find.
                `;

                try {
                    // Read preference
                    const preferredModel = localStorage.getItem('iStudy_preferred_model') || 'gemini-3.1-flash-lite';
                    const result = await window.Core.GeminiRequest(preferredModel, prompt);
                    const data = result.data;

                    const text = window.Core.CleanResponseText(data);
                    if (!text) throw new Error("EMPTY_RESPONSE");
                    console.log("LLM Raw Response:", text);

                    const jsonMatch = text.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        const parsed = JSON.parse(jsonMatch[0]);
                        if (!Array.isArray(parsed)) throw new Error("Parsed result is not an array");
                        return { responses: parsed, error: null };
                    } else {
                        throw new Error("No JSON array found in response");
                    }
                } catch (err) {
                    console.error("Smart Parse Error:", err);
                    const msg = err.message || "";
                    if (msg.toLowerCase().includes("quota") || msg.toLowerCase().includes("limit") || msg.toLowerCase().includes("429")) {
                        return { responses: null, error: "⚠️ **AI Service Temporarily Unavailable.** The AI service has hit its usage limit. Please try again in a few minutes, or come back later today. The quota resets automatically. If this keeps happening, please notify Dr. Mora." };
                    }
                    return { responses: null, error: msg };
                }
            },
            GeminiRequest: async (model, promptText) => {
                // All AI calls are proxied through the Apps Script backend.
                // The instructor's API key lives only in the Google Sheet (API_Key!A1)
                // and is never sent to the student's browser.
                const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5z-WPUT6f5hNGzXVSwVnPtndmNCA_QLMegG4ZiPtmyCz2ctPF6XOkCrfOxXoe59JvTA/exec';

                // 1. DYNAMIC CHAIN RESOLUTION: 1st Gemini 3.1 Flash-Lite, 2nd Gemini 3.5 Flash-Lite, 3rd/4th Gemma
                let targetModel = model || localStorage.getItem('iStudy_preferred_model') || 'gemini-3.1-flash-lite';

                let uniqueChain = [];
                const savedChainRaw = localStorage.getItem('iStudy_active_chain');
                let savedChain = [];
                try {
                    savedChain = savedChainRaw ? JSON.parse(savedChainRaw) : [];
                } catch (e) { savedChain = []; }

                if (savedChain.length > 0 && savedChain.some(m => m.includes('gemini'))) {
                    uniqueChain = [targetModel, ...savedChain.filter(m => m !== targetModel)];
                } else {
                    uniqueChain = [targetModel, 'gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemma-4-26b-a4b-it', 'gemma-4-31b-it'];
                }
                uniqueChain = [...new Set(uniqueChain)];

                const errorLog = [];

                for (const currentModel of uniqueChain) {
                    console.log(`[Core] Attempting Model Phase via proxy: ${currentModel}`);
                    try {
                        const response = await fetch(APPS_SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({
                                action: 'proxyGemini',
                                model: currentModel,
                                promptText: promptText
                            })
                        });

                        const rawText = await response.text();
                        let data;
                        try {
                            data = JSON.parse(rawText);
                        } catch (parseErr) {
                            throw new Error(`Server returned unparseable response (${response.status || 'OK'})`);
                        }

                        if (data.error) {
                            const msg = data.error.message || JSON.stringify(data.error);
                            const errStr = `[${currentModel}]: ${msg}`;
                            console.warn(errStr);
                            errorLog.push(errStr);
                            continue;
                        }

                        const text = window.Core.CleanResponseText(data);
                        const isSafetyBlocked = data?.candidates?.[0]?.finishReason === 'SAFETY' || data?.promptFeedback?.blockReason === 'SAFETY';

                        if (!text || isSafetyBlocked) {
                            const reason = isSafetyBlocked ? "SAFETY_BLOCK" : "EMPTY_CONTENT";
                            const errStr = `[${currentModel}]: ${reason}`;
                            console.warn(errStr);
                            errorLog.push(errStr);
                            continue;
                        }

                        return { data, modelUsed: currentModel };

                    } catch (err) {
                        const msg = err.message || "Network/Fetch Error";
                        const errStr = `[${currentModel} Net]: ${msg}`;
                        console.warn(errStr);
                        errorLog.push(errStr);
                        // Short pause between model retries to allow transient network/WiFi hiccups to clear
                        await new Promise(resolve => setTimeout(resolve, 500));
                        continue;
                    }
                }

                const finalMsg = "Unable to generate response. All models failed:\n" + errorLog.join("\n");
                console.error(finalMsg);
                throw new Error(finalMsg);
            },

            // DISCOVERY UTILITIES
            Discovery: {
                getQualityTiers: () => [
                    'gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemma-4-26b-a4b-it', 'gemma-4-31b-it'
                ],
                probeModel: async (modelId) => {
                    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5z-WPUT6f5hNGzXVSwVnPtndmNCA_QLMegG4ZiPtmyCz2ctPF6XOkCrfOxXoe59JvTA/exec';
                    try {
                        const res = await fetch(APPS_SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: 'proxyGemini', model: modelId, promptText: 'ping' })
                        });
                        const rawText = await res.text();
                        let data;
                        try { data = JSON.parse(rawText); } catch(e) { return { active: false }; }
                        if (data.error) {
                            const msg = data.error.message?.toLowerCase() || '';
                            if (msg.includes('permission') || msg.includes('quota') || msg.includes('exhausted') || msg.includes('not found')) return { active: false };
                        }
                        if (data.candidates || data.promptFeedback) return { active: true };
                        return { active: false };
                    } catch (e) { return { active: false }; }
                },
                getAiRanking: async (judgeModelId, candidateList) => {
                    const prompt = `
                        I have access to these Google AI models: [${candidateList.join(', ')}].
                        Rank them from smartest (most complex reasoning/grading) to fastest (quick responses).
                        Also provide a VERY BRIEF 1-sentence reason why the top model is #1.
                        Output FORMAT: [ModelID1, ModelID2, ...] | Reason: YourReason
                    `;
                    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5z-WPUT6f5hNGzXVSwVnPtndmNCA_QLMegG4ZiPtmyCz2ctPF6XOkCrfOxXoe59JvTA/exec';
                    try {
                        const res = await fetch(APPS_SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({ action: 'proxyGemini', model: judgeModelId, promptText: prompt })
                        });
                        const rawText = await res.text();
                        let data;
                        try { data = JSON.parse(rawText); } catch(e) { return null; }
                        const text = window.Core.CleanResponseText(data);
                        const rankMatch = text.match(/\[(.*?)\]/);
                        const reasonMatch = text.split('| Reason:')[1] || "AI-Judged order based on internal benchmarks.";
                        if (rankMatch) {
                            const rankedArray = rankMatch[1].split(',').map(s => s.trim().replace(/['"]/g, ''));
                            const cleanRanked = rankedArray.filter(name => candidateList.includes(name));
                            const finalRanked = [...cleanRanked, ...candidateList.filter(name => !cleanRanked.includes(name))];
                            return { ranked: finalRanked, reason: reasonMatch };
                        }
                        return null;
                    } catch (e) { return null; }
                }
            },


            BatchAnalyzeResponses: async (transcript, questions, studentResponses) => {
                const prompt = `
                    Analyze these student responses for a Biogeography course based on the lecture transcript.
                    
                    Transcript: "${transcript.substring(0, 300000)}" // Increased limit for long lectures
                    
                    Questions & Student Responses:
                    ${questions.map((q, i) => `
                    Q${q.question_number}: ${q.question_text}
                    Student said: "${studentResponses[i]}"
                    `).join('\n')}

                    Task:
                    Review each question and student response. For EACH question, provide:
                    1. "grade": A number (1-5) evaluating the student response.
                    2. "critique": A concise critique of what was right/wrong with the student's answer.
                    3. "model_answer": The ideal model answer strictly based on the lecture transcript.
                    4. "timestamp": The exact timestamp (e.g. "12:45") from the lecture transcript where the answer is found.
                    5. "joker_mode": Randomly choose either "FACTUAL" or "CHALLENGE".
                    6. "joker_statement": A short dialogue spoken by "Joker" (a confident peer testing the student's critical thinking):
                       - If joker_mode is "FACTUAL": Paraphrase the model answer accurately in peer tone (e.g. "If I remember correctly from the video, [accurate fact]. Do you agree with this?").
                       - If joker_mode is "CHALLENGE": Present a subtle conceptual oversight/misconception derived from the model answer that sounds plausible but is factually incorrect (e.g. "If I remember correctly from the video, [plausible misconception]. Do you agree with this?").
                    7. "joker_feedback_correct": Short peer dialogue (1-2 sentences) when the student gives the correct judgment (Agreed if FACTUAL, or Disagreed if CHALLENGE). E.g. "Spot on! You got it right..." or "Nice catch! You didn't fall for the trap! In the video...".
                    8. "joker_feedback_incorrect": Short peer dialogue (1-2 sentences) when the student gives the incorrect judgment (Disagreed if FACTUAL, or Agreed if CHALLENGE). E.g. "Gotcha! You fell for the trap! Actually, ..." or "Nope, that was actually true based on the video!".

                    Output MUST be a STRICT JSON array of objects:
                    [
                      {
                        "grade": 4,
                        "critique": "...",
                        "model_answer": "...",
                        "timestamp": "12:45",
                        "joker_mode": "CHALLENGE",
                        "joker_statement": "If I remember correctly from the video, ... Do you agree with this?",
                        "joker_feedback_correct": "Nice catch! You didn't fall for the trap...",
                        "joker_feedback_incorrect": "Gotcha! You fell for it..."
                      }
                    ]
                `;

                try {
                    // Use user preference for batch analysis too
                    const preferredModel = localStorage.getItem('iStudy_preferred_model') || 'gemini-3.1-flash-lite';
                    const result = await window.Core.GeminiRequest(preferredModel, prompt);
                    const data = result.data;
                    const text = window.Core.CleanResponseText(data);
                    if (!text) throw new Error("EMPTY_RESPONSE");
                    console.log("Batch Analysis Raw Response:", text);
                    const jsonMatch = text.match(/\[[\s\S]*\]/);
                    let raw = jsonMatch ? jsonMatch[0] : text;
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed)) throw new Error("Batch analysis did not return an array.");

                    return parsed;
                } catch (e) {
                    console.error("Batch Analysis Error:", e);
                    const msg = e.message || String(e);
                    if (msg.toLowerCase().includes("quota") || msg.toLowerCase().includes("limit") || msg.includes("429")) {
                        throw e; // Propagate Quota errors to trigger Lock
                    }
                    return questions.map(() => ({ grade: 1, critique: "Analysis failed", model_answer: "N/A" }));
                }
            },
            VerifyStudentEmail: async (email) => {
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbz5z-WPUT6f5hNGzXVSwVnPtndmNCA_QLMegG4ZiPtmyCz2ctPF6XOkCrfOxXoe59JvTA/exec';
                try {
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'requestOTP', email: email })
                    });
                    const rawText = await response.text();
                    let data;
                    try { data = JSON.parse(rawText); } catch(e) { return { status: 'error', message: "Invalid server response. Please try again." }; }
                    return data;
                } catch (err) {
                    console.error("Email verification error:", err);
                    return { status: 'error', message: "Connection to Google Sheets failed. Check your Web App URL." };
                }
            },
            VerifyOTP: async (email, code) => {
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbz5z-WPUT6f5hNGzXVSwVnPtndmNCA_QLMegG4ZiPtmyCz2ctPF6XOkCrfOxXoe59JvTA/exec';
                try {
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'verifyOTP', email: email, otp: code })
                    });
                    const rawText = await response.text();
                    let data;
                    try { data = JSON.parse(rawText); } catch(e) { return { status: 'error', message: "Invalid server response. Please try again." }; }
                    return data;
                } catch (err) {
                    return { status: 'error', message: err.toString() };
                }
            },
            RegisterCompletion: async (email, chapter, uniqueCode, reportContent, finalGrade) => {
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbz5z-WPUT6f5hNGzXVSwVnPtndmNCA_QLMegG4ZiPtmyCz2ctPF6XOkCrfOxXoe59JvTA/exec';
                const payload = {
                    action: 'registerCompletion',
                    email: email,
                    studentId: email,
                    chapter: chapter,
                    uniqueCode: uniqueCode,
                    reportContent: reportContent,
                    finalGrade: finalGrade
                };
                try {
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    const rawText = await response.text();
                    let data;
                    try { data = JSON.parse(rawText); } catch(e) { return { status: 'error', message: "Submission failed: non-JSON server response." }; }
                    return data;
                } catch (err) {
                    console.error("RegisterCompletion Error:", err);
                    return { status: 'error', message: err.toString() };
                }
            }
        };

        window.InvokeLLM = async (prompt, context = {}) => {
            const systemContext = `
                You are playing a role in an educational system for a Biogeography course.
                Your task is to respond as an AI character to a student's response.
                
                Course Data:
                - Lecture Transcript: ${context.transcript || 'Not available'}
                - The Question: ${context.question || 'Not available'}
                - Student's Transcribed Response: ${context.student_response || 'Not available'}

                Character/Instruction: ${prompt}
                
                Please keep your response academic yet engaging, and stay strictly within the context of the course transcript provided.
            `;

            try {
                const result = await window.Core.GeminiRequest('gemini-3.1-flash-lite', systemContext);
                return window.Core.CleanResponseText(result?.data) || "I apologize, but I am having trouble forming a response right now. Let's continue.";
            } catch (err) {
                console.error("Gemini API Error:", err);
                const msg = err.message || "";
                if (msg.toLowerCase().includes("quota") || msg.toLowerCase().includes("limit") || msg.toLowerCase().includes("429")) {
                    return "System: ⚠️ **AI Service Temporarily Unavailable.** The AI service has hit its usage limit. Please try again in a few minutes, or come back later today. The quota resets automatically. If this keeps happening, please notify Dr. Mora.";
                }
                return `System: Error connecting to the AI service. Please check your internet connection. Details: ${msg}`;
            }
        };

        const characters = {
            newton: { name: "Newton", emoji: "", avatarClass: "avatar-newton" },
            tontin: { name: "Tontin", emoji: "", avatarClass: "avatar-tontin" },
            joker: { name: "Joker", emoji: "", avatarClass: "avatar-joker" },
            system: { name: "System", emoji: "", avatarClass: "avatar-system" },
            user: { name: "Student", emoji: "👤", avatarClass: "" }
        };

        const Roadmap = ({ roadmapData }) => {
            if (!roadmapData) return null;

            const chGrades = {
                1: 'F', 2: 'F', 3: 'F', 4: 'F', 5: 'D-',
                6: 'D', 7: 'D+', 8: 'C-', 9: 'C', 10: 'C+',
                11: 'B-', 12: 'B', 13: 'B+'
            };

        const DiscoveryOverlay = ({ apiKeys, onComplete }) => {
            const [status, setStatus] = React.useState('discovering'); // 'discovering', 'probing', 'judging', 'complete'
            const [discovered, setDiscovered] = React.useState([]);
            const [probedIndices, setProbedIndices] = React.useState({}); // { index: 'testing'|'active'|'restricted' }
            const [activeModels, setActiveModels] = React.useState([]);
            const [finalChain, setFinalChain] = React.useState([]);
            const [verdict, setVerdict] = React.useState(null);
            const [error, setError] = React.useState(null);
            const listRef = React.useRef(null);

            React.useEffect(() => {
                const runDiscovery = async () => {
                    if (!apiKeys || apiKeys.length === 0) {
                        setError("No API Keys provided for discovery.");
                        return;
                    }
                    const key = apiKeys[0].key; // Use primary key for judge/probe

                    try {
                        // 1. DISCOVER (Gemini Flash & Gemma models)
                        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${key}`;
                        const response = await fetch(url);
                        const data = await response.json();
                        const raw = data.models || [];
                        const pruned = raw.filter(m => {
                            const id = m.name.toLowerCase();
                            return m.supportedGenerationMethods.includes('generateContent') &&
                                   (id.includes('flash') || id.includes('gemma')) &&
                                   !id.includes('embedding') &&
                                   !id.includes('aqa') &&
                                   !id.includes('rag');
                        });
                        setDiscovered(pruned);
                        setStatus('probing');

                        // 2. PROBE
                        const activeList = [];
                        for (let i = 0; i < pruned.length; i++) {
                            const id = pruned[i].name.split('/').pop();
                            setProbedIndices(prev => ({ ...prev, [i]: 'testing' }));

                            // Auto-scroll to the item being tested
                            if (listRef.current && listRef.current.children[i]) {
                                listRef.current.children[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            }

                            const res = await window.Core.Discovery.probeModel(id, key);
                            if (res.active) {
                                setProbedIndices(prev => ({ ...prev, [i]: 'active' }));
                                activeList.push(id);
                            } else {
                                setProbedIndices(prev => ({ ...prev, [i]: 'restricted' }));
                            }
                        }

                        if (activeList.length === 0) {
                            setError("All discovered models are currently restricted (0/0 quota). Please check your Google AI account status.");
                            return;
                        }

                        setActiveModels(activeList);
                        setStatus('judging');

                        // 3. JUDGE
                        const judgeId = activeList.find(id => id.includes('pro')) || activeList[0];
                        const ranking = await window.Core.Discovery.getAiRanking(judgeId, activeList, key);

                        const finalOrder = ranking ? ranking.ranked : activeList;
                        setFinalChain(finalOrder);
                        setVerdict(ranking ? ranking.reason : "Ranked based on model family hierarchy.");

                        // 4. PERSIST
                        localStorage.setItem('iStudy_active_chain', JSON.stringify(finalOrder));
                        localStorage.setItem('iStudy_judge_verdict', ranking ? ranking.reason : "");
                        setStatus('complete');

                    } catch (err) {
                        console.error("Discovery Error:", err);
                        setError("Connection failed. Check your internet or API key.");
                    }
                };

                runDiscovery();
            }, []);

            if (error) {
                return (
                    <div className="discovery-overlay">
                        <div className="discovery-modal" style={{ textAlign: 'center' }}>
                            <div className="discovery-title" style={{ color: '#ef4444' }}>System Error</div>
                            <p className="discovery-subtitle">{error}</p>
                            <button className="discovery-btn" onClick={() => window.location.reload()}>Retry</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="discovery-overlay">
                    <div className="discovery-modal">
                        <div className="discovery-title">Selecting Gemma AI Models</div>
                        <p className="discovery-subtitle">
                            {status === 'discovering' && "Finding available Gemma models from your account..."}
                            {status === 'probing' && "Testing Gemma models. This is done only once but it may take a minute..."}
                            {status === 'judging' && "Ranking Gemma models by capability..."}

                        <div className="discovery-list" ref={listRef}>
                            {discovered.map((m, i) => {
                                const id = m.name.split('/').pop();
                                const probeStatus = probedIndices[i] || 'testing';
                                return (
                                    <div key={i} className="discovery-item" style={{ opacity: probeStatus === 'restricted' ? 0.4 : 1 }}>
                                        <span>{id}</span>
                                        <span className={`discovery-status ${probeStatus}`}>
                                            {probeStatus === 'testing' && "Testing..."}
                                            {probeStatus === 'active' && "✅ Active"}
                                            {probeStatus === 'restricted' && "❌ Restricted"}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>

                        {status === 'complete' && (
                            <div className="final-chain-box">
                                <div className="final-chain-header">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    Active Chain Verified
                                </div>
                                {finalChain.slice(0, 3).map((id, i) => (
                                    <div key={i} className="final-chain-item">
                                        <span>#{i + 1} <strong>{id}</strong></span>
                                        <span style={{ fontSize: '0.65rem' }}>{i === 0 ? "Primary" : "Fallback"}</span>
                                    </div>
                                ))}
                                {verdict && <div className="verdict-text"><strong>AI Verdict:</strong> {verdict}</div>}
                            </div>
                        )}

                        {status === 'complete' && (
                            <div className="discovery-footer">
                                <button className="discovery-btn" onClick={() => onComplete(finalChain)}>Proceed to Class</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

            // Internal InvokeLLM with Lock Logic
            const invokeLLM = async (prompt, context = {}) => {
                const systemContext = `
                    You are playing a role in an educational system for a Biogeography course.
                    Your task is to respond as an AI character to a student's response.
                    
                    Course Data:
                    - Lecture Transcript: ${context.transcript || 'Not available'}
                    - The Question: ${context.question || 'Not available'}

                `;

                    const targetModel = selectedModel || 'gemini-3.1-flash-lite';

                    // Sync UI with the actual model that responded
                    if (result?.modelUsed) {
                        setSelectedModel(result.modelUsed);
                    }

                    const data = result?.data;
                    const text = window.Core.CleanResponseText(data);
                    if (!text) {
                        console.warn("Safety block or empty response detected after all retries.");

                    }

                    return text;
                } catch (err) {

                    if (msg.toLowerCase().includes("quota") || msg.toLowerCase().includes("limit") || msg.toLowerCase().includes("429")) {
                        setIsSystemLocked(true);
                        addMessage('system', "⚠️ **AI Service Temporarily Unavailable.** The AI service has hit its usage limit. \n\n**Please try again in a few minutes**, or come back later today. The quota resets automatically.\n\n*If this keeps happening, please notify Dr. Mora.*");
                        retryRequestRef.current = { type: 'CHAT' };
                        return null; // Signal to Halt
                    }

                    if (msg.includes("SAFETY_BLOCK") || msg.includes("EMPTY_CONTENT")) {
                        addMessage('system', "ℹ️ *The AI had trouble formulating a phrasing for this specific point. Moving forward so you can continue without delay.*");
                        return "I'm having a little trouble with my phrasing on this one—let's keep going so we stay on track!";
                    }

                    addMessage('system', `⚠️ **Connection Note:** The response took longer than expected or the connection was briefly interrupted. Please check your internet connection and try sending your message again.`);
                    return null;
                }
            };
            const [selectedModel, setSelectedModel] = useState(localStorage.getItem('iStudy_preferred_model') || 'gemini-3.1-flash-lite');

            const [submission, setSubmission] = useState({

            const chatScrollRef = useRef(null);
            const fileInputRef = useRef(null);

            // Auto-resize textarea
            useEffect(() => {

            useEffect(() => {

            const addMessage = (charKey, text, type = 'text') => {

            // Startup: Load existing chain if available and valid

                    localStorage.setItem('iStudy_preferred_model', 'gemini-3.1-flash-lite');
                    setActiveChain(DEFAULT_MODEL_CHAIN);

                // Load API Keys
                const rawKeys = localStorage.getItem('google_api_key');
                if (rawKeys) {
                    try {
                        const parsed = JSON.parse(rawKeys);

            }, []);

            const proceedToUploadOrBriefing = () => {

            const handleUploadClick = () => {

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Reset file input so re-selecting the same file will trigger onChange
                if (fileInputRef.current) fileInputRef.current.value = '';

                setView('chat');

                const isImage = file.type.startsWith('image/') || ['.png', '.jpg', '.jpeg', '.webp'].some(ext => file.name.toLowerCase().endsWith(ext));
                const isTxt = ['.txt', '.md'].some(ext => file.name.toLowerCase().endsWith(ext));

                if (!isImage && !isTxt) {
                    addMessage('system', "### ⚠️ Unsupported File Format\n\nThis app takes a .txt file. In programs like Excel or Word, click on 'Save as', then select text file (.txt).");

            const handleChapterSelected = async (chapterNum) => {
                setIsProcessing(true);
                addMessage('system', "I am processing your responses... this may take a moment");
                try {
                    const data = await window.Core.FetchChapterData(chapterNum);

                    const questionCount = data.questions.length;

                    // Attempt Smart Segmentation
                    const smartResult = await window.Core.SmartParseResponses(window.lastRawText || "", questionCount, chapterNum);

                    if (smartResult && smartResult.responses) {
                        window.lastTranscribed = smartResult.responses;
                    } else if (smartResult && smartResult.error) {
                        if (smartResult.error.toLowerCase().includes('quota') || smartResult.error.includes('429')) {
                            addMessage('system', "⚠️ **AI Service Temporarily Unavailable.** The AI service has hit its usage limit. Please try again in a few minutes, or come back later today. The quota resets automatically. If this keeps happening, please notify Dr. Mora.");
                            setIsSystemLocked(true); // LOCK SYSTEM
                            retryRequestRef.current = { type: 'CHAPTER_SELECT', payload: { chapterNum } };
                            setIsProcessing(false);
                            return; // STOP HERE
                        }
                        addMessage('system', `Smart analysis warning: ${smartResult.error}. Falling back to line-by-line mode.`);
                    } else {
                        addMessage('system', "Smart analysis failed. Falling back to line-by-line mode.");
                    }

                    const responseCount = window.lastTranscribed ? window.lastTranscribed.length : 0;

                    console.log(`DEBUG: questionCount=${questionCount}, responseCount=${responseCount}`);

                    if (questionCount !== responseCount) {
                        addMessage('system', `❌ **Mismatch Detected!** Chapter ${chapterNum} has ${questionCount} questions, but your response sheet has ${responseCount} responses. Please upload a completed response sheet. Ensure to clearly enumerate your responses.`);

                    // BATCH ANALYSIS START

                    addMessage('system', "Error fetching chapter data: " + err.message);

            const runBatchAnalysis = async (transcript, questions, responses, chapterNum) => {
                try {
                    const analysisResults = await window.Core.BatchAnalyzeResponses(transcript, questions, responses);

                    const enrichedQuestions = questions.map((q, i) => ({
                        ...q,
                        student_response: responses[i],
                        initial_response: responses[i],
                        final_response: responses[i],
                        analysis: analysisResults[i] || { grade: 0, critique: "Analysis failed", model_answer: "N/A" }
                    }));

                    setSubmission(prev => ({
                        ...prev,
                        chapter: chapterNum,
                        transcript: transcript,
                        questions: enrichedQuestions,
                        status: 'reviewing'
                    }));

                    const chaptersCompleted = roadmapData ? Object.keys(roadmapData).filter(k =>
                        (k.toLowerCase().includes('chapter') || k.toLowerCase().includes('video')) && roadmapData[k]
                    ).length : 0;

                    if (chaptersCompleted < 4) {
                        addMessage('system', "This review may take up to 60 minutes, ensure you have that time available until you finish, as partial work cannot be saved. Ready to begin?");
                        setIsWaitingForReviewStart(true);
                    } else {
                        addMessage('system', "Remember we need at least 60 minutes to finish reviewing your responses. Ready to begin?");
                        setIsWaitingForReviewStart(true);
                    }

                    setCurrentQIndex(0);
                    setReviewStep(0);
                    setIsProcessing(false);
                    setIsSystemLocked(false);

                } catch (err) {
                    const msg = err.message || String(err);
                    if (msg.includes('429') || msg.toLowerCase().includes('quota')) {
                        addMessage('system', "⚠️ **AI Service Temporarily Unavailable.** The AI service has hit its usage limit. Please try again in a few minutes, or come back later today. The quota resets automatically. If this keeps happening, please notify Dr. Mora.");
                        setIsSystemLocked(true);
                        retryRequestRef.current = { type: 'BATCH', payload: { transcript, questions, responses, chapterNum } };
                    } else {
                        addMessage('system', "Error during batch analysis: " + msg);
                    }
                    setIsProcessing(false);
                }
            };


            const startReview = async (qIdx, step) => {
                runNextStep(qIdx, step);
            };

            // We allow passing 'questionsOverride' because state updates might not be immediate in the initial call
            const runNextStep = async (qIdx, step, studentMsg = "", questionsOverride = null) => {
                const currentQuestions = questionsOverride || submission.questions;
                const q = currentQuestions[qIdx];
                if (!q) {
                    addMessage('system', "Great, we have reviewed all questions now. I have to compile them for you to read and approve. After approving, your responses will be saved to your machine and a message of completion will be sent to Dr. Mora. You will also be able to modify or edit specific responses. Can I compile the responses now?");
                    setIsWaitingForCompilation(true);
                    setIsProcessing(false);
                    return;
