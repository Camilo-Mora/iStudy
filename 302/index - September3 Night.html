                // Removed the greedy update that was overwriting final_response with conversational 'Yes/No' messages.
                // Newton's phase (Step 0) now explicitly handles the final_response lock-in.

                // NEW: Skip introductions if any chapter/video is already completed
                const chaptersCompleted = roadmapData ? Object.keys(roadmapData).filter(k =>
                    (k.toLowerCase().includes('chapter') || k.toLowerCase().includes('video')) && roadmapData[k]
                ).length : 0;
                const skipIntro = chaptersCompleted >= 4;

                // LIGHTWEIGHT CONTEXT - Uses Pre-calc Model Answer instead of full Transcript
                const analysis = q.analysis || {};
                const commonContext = {
                    transcript: "Model Answer for context: " + analysis.model_answer, // Light context
                    question: q.question_text,
                    student_response: studentMsg || q.final_response || q.student_response
                };

                // STEP 0: NEWTON (Grades & Feedback) -> TONTIN INTRO
                // STEP 0: NEWTON (Structured Report & Discussion)
                if (step === 0) {
                    if (!studentMsg) {
                        setIsProcessing(true);
                        const report = `
### Question ${q.question_number}
${q.question_text}

#### Your Response:
${q.student_response}

#### Score:
${analysis.grade}/5

#### Feedback:
${analysis.critique}

#### Model Answer(AI):
${analysis.model_answer}

${analysis.timestamp ? `***I found this response around minute ${analysis.timestamp} of the video.***` : ''}
                        `;
                        addMessage('newton', report);
                        setTimeout(() => {
                            addMessage('newton', "Do you agree with this assessment? (Type **'Yes'** to accept the Model Answer, or provide a better explanation/argument to improve your score.)");
                            setIsProcessing(false);
                        }, 1000);
                        return;
                    } else {
                        setIsProcessing(true);
                        const lowerMsg = studentMsg.toLowerCase();
                        if (lowerMsg === 'yes' || lowerMsg === 'agree' || lowerMsg === 'ok' || lowerMsg.includes('accept')) {
                            setSubmission(prev => {
                                const newQs = [...prev.questions];
                                newQs[qIdx] = { ...newQs[qIdx], final_response: analysis.model_answer, final_grade: analysis.grade };
                                return { ...prev, questions: newQs };
                            });
                            setReviewStep(1);
                            setTimeout(() => runNextStep(qIdx, 1, ""), 500);
                        } else {
                            setIsProcessing(true);
                            const reEvalPrompt = `
                                You are Newton 🧠. Analyze this student's improved explanation against the Model Answer.
                                
                                Model Answer: "${analysis.model_answer}"
                                Student's New Explanation: "${studentMsg}"
                                
                                Provide STRICTLY a JSON object with:
                        - "critique": String(feedback on the new explanation).
                                - "updated_model_answer": String(The original Model Answer, but updated to seamlessly incorporate any valid new details from the student's explanation. If the student's point is invalid, keep it unchanged).
                                
                                No markdown, just JSON.
                            `;

                            try {
                                const resText = await invokeLLM(reEvalPrompt, commonContext);
                                if (!resText) return; // HALT if Locked

                                const jsonMatch = resText.match(/\{[\s\S]*\}/);

                                const newEval = jsonMatch ? JSON.parse(jsonMatch[0]) : { critique: "I've reviewed your update.", updated_model_answer: analysis.model_answer };

                                // Ensure we have a valid model answer fallback
                                const finalModelAnswer = newEval.updated_model_answer || analysis.model_answer;

                                setSubmission(prev => {
                                    const newQs = [...prev.questions];
                                    newQs[qIdx] = {
                                        ...newQs[qIdx],
                                        analysis: { ...newQs[qIdx].analysis, ...newEval, model_answer: finalModelAnswer },
                                        student_response: studentMsg
                                    };
                                    return { ...prev, questions: newQs };
                                });

                                const report = `
### Question ${q.question_number}
${q.question_text}

#### Your Additional Comment:
${studentMsg}

#### Feedback:
${newEval.critique}

#### Model Answer (AI):
${finalModelAnswer}

${analysis.timestamp ? `***I found this response around minute ${analysis.timestamp} of the video.***` : ''}
`;
                                addMessage('newton', report);
                                setTimeout(() => {
                                    addMessage('newton', "Do you agree with this assessment? (Type **'Yes'** to accept this Updated Model Answer, or provide further explanation.)");
                                    setIsProcessing(false);
                                }, 1000);
                            } catch (err) {
                                console.error("Re-eval error:", err);
                                addMessage('newton', "I had trouble analyzing that. Could you try again or just say 'Yes' if you want to proceed?");
                                setIsProcessing(false);
                            }
                        }
                        setIsProcessing(false);

                    }
                }

                // STEP 1: TONTIN (One-Shot Feedback)
                else if (step === 1) {
                    if (!studentMsg) {
                        setIsProcessing(true);

                        await new Promise(r => setTimeout(r, 600));
                        addMessage('tontin', `I’m still a bit lost on this one—could you explain it to me in a different way? How would you explain this to a grandma? \n\n**The Question:** ${q.question_text}`);
                        setIsProcessing(false);
                        return;
                    } else {
                        setIsProcessing(true);
                        const tontinEvalPrompt = `### EDUCATIONAL CONTEXT
This is a pedagogical exercise designed to enhance the student's capacity to articulate course content clearly and independently. 

### ROLE
You are "Tontin," a struggling peer student requiring the User to explain a given question in their own words. Your goal is to see if the student’s alternative explanation matches the expected response. Your assessment must be humble and specific to the material provided, outlining what was clear or not.

### INPUT DATA
1. **Student Explanation:** "${studentMsg}"
2. **Expected Response:** "${analysis.model_answer}"

### TASK
Compare the **Student Explanation** against the **Expected Response**.

1.  **Validity Check (Rubbish):** If the student's entry is nonsensical or unrelated:
    *   Start directly with: "I could not make sense of what you wrote." (No header).
    *   **DO NOT include the '**What was clear:**' header.**
    *   List missing concepts from the **Expected Response** under the '**What is missing or incorrect:**' header.

2.  **Copy-Paste Check:** If exactly copied:
    *   Assessment: **Low**.
    *   List the copied concepts under '**What was clear:**'.
    *   Under '**What is missing or incorrect:**', state: "It looks like you copied the lecture notes! Next time please try to use your own words."

3.  **Normal Analysis:** 
    *   List ARTICULATED concepts under '**What was clear:**'.
    *   List gaps under '**What is missing or incorrect:**'.

### MANDATORY GUARDRAILS
*   **No Questions:** Do not ask anything. The student cannot reply.
*   **Final Assessment Phrases:**
    *   **High:** "This is great, it is clear to me now!"
    *   **Medium/Low:** "I am still not fully clear; I will watch that part of the video again to be certain."
*   **CRITICAL FORMATTING:** 
    *   **Headers:** Always put headers like **What was clear:** or **What is missing or incorrect:** on their own separate line in **bold**.
    *   **Spacing:** You MUST use TWO blank lines (hit Enter twice) between every bullet point (✅ or ❓). 
    *   **NO HTML:** Never use literal tags like <br>. Only use standard text and the Enter key for breaks.

### OUTPUT FORMAT EXAMPLE:
I could not make sense of what you wrote.

**What is missing or incorrect:**

❓ [Missing Concept A]


❓ [Missing Concept B]


**My assessment:** Low. I am still not fully clear; I will watch that part of the video again to be certain.

### ACTUAL OUTPUT START:
(Start your response here based on the student's message)
`;

                        let tontinEval = null;
                        try {
                            tontinEval = await invokeLLM(tontinEvalPrompt, commonContext);
                        } catch (e) {
                            console.warn("Tontin first attempt error:", e);
                        }

                        // Auto-retry once if first attempt was empty, null, or fallback string
                        if (!tontinEval || tontinEval.includes("trouble with my phrasing")) {
                            try {
                                await new Promise(r => setTimeout(r, 600));
                                const retryResult = await invokeLLM(tontinEvalPrompt, commonContext);
                                if (retryResult && !retryResult.includes("trouble with my phrasing")) {
                                    tontinEval = retryResult;
                                }
                            } catch (e) {
                                console.warn("Tontin retry attempt error:", e);
                            }
                        }

                        // If still unavailable, use graceful pre-computed educational response with Model Answer
                        if (!tontinEval || tontinEval.includes("trouble with my phrasing")) {
                            tontinEval = `Thanks for explaining that in your own words!\n\n**Key concepts to keep in mind:**\n\n✅ ${analysis.model_answer}\n\n**My assessment:** I'm following better now—let's keep moving!`;
                        }

                        addMessage('tontin', tontinEval);

                        // Transition to Joker
                        setIsProcessing(false);
                        setTimeout(() => {
                            setReviewStep(2);
                            addMessage('joker', "My turn! Can I go next?");
                            setIsWaitingForAvatarStart(true);
                        }, 1500);
                    }
                }

                // STEP 2: JOKER (Instant Pre-Computed Challenge & Response)
                else if (step === 2) {
                    setIsProcessing(true);

                    // Use pre-computed Joker statement from batch analysis, with reliable fallback
                    const mode = (analysis.joker_mode || "FACTUAL").toUpperCase();
                    let statement = analysis.joker_statement;
                    if (!statement) {
                        statement = mode === "FACTUAL"
                            ? `If I remember correctly from the video, ${analysis.model_answer}. Do you agree with this?`
                            : `If I remember correctly from the video, ${analysis.model_answer}. Do you agree with this?`;
                    }
                    setJokerData({ mode, statement });
                    addMessage('joker', statement);
                    setIsProcessing(false);
                    setIsWaitingForJokerDecision(true);
                    return;
                }
            };

            const handleJokerDecision = (choice) => {
                if (isProcessing) return;
                setIsWaitingForJokerDecision(false);

                const studentMsg = choice === 'agree' ? "I Agree" : "I Disagree";
                addMessage('user', studentMsg);
                setIsProcessing(true);

                const currentQ = submission.questions[currentQIndex];
                const analysis = currentQ?.analysis || {};
                const mode = (analysis.joker_mode || jokerData.mode || "FACTUAL").toUpperCase();
                const isCorrect = (mode === "FACTUAL" && choice === 'agree') || (mode === "CHALLENGE" && choice === 'disagree');

                // Determine feedback: Pre-computed from initial query, with robust local fallback
                let feedback = "";
                if (isCorrect) {
                    feedback = analysis.joker_feedback_correct || (
                        mode === "FACTUAL"
                            ? "Spot on! That statement was accurate and matches the lecture material."
                            : `Nice catch! You didn't fall for the trap. The lecture actually explained: ${analysis.model_answer}`
                    );
                } else {
                    feedback = analysis.joker_feedback_incorrect || (
                        mode === "FACTUAL"
                            ? `Actually, that statement was factually correct based on the lecture: ${analysis.model_answer}`
                            : `Gotcha! You fell for the trap! In the lecture, the verified answer was: ${analysis.model_answer}`
                    );
                }

                // Short 300ms natural delay without any LLM network latency
                setTimeout(() => {
                    addMessage('joker', feedback);
                    setIsProcessing(false);

                    // Transition to next question or completion
                    setTimeout(() => {
                        if (currentQIndex < submission.questions.length - 1) {
                            addMessage('system', "Can we move to the next question?");
                            setIsWaitingForNextQuestion(true);
                        } else {
                            runNextStep(currentQIndex + 1, 0);
                        }
                    }, 1000);
                }, 300);
            };

            const runAvatarIntroductions = async () => {
                // Version 1.5: Character intros are now part of the Mission Briefing.
                // We directly trigger the review start question.
                addMessage('system', "**Let's review your responses one by one. Are you ready?**");
                setIsWaitingForReviewStart(true);
                setIsProcessing(false);
            };

            const handleVoiceInput = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                if (!SpeechRecognition) {
                    alert("Voice dictation is not fully supported in this browser.\n\nPlease use Google Chrome, Edge, or Safari for the best experience.");
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    addMessage('system', "🎤 Listening...");
                };

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setInputValue(prev => (prev ? prev + " " : "") + text);
                    // Remove system "Listening..." message if possible (optional refinement)
                };

                recognition.onerror = (event) => {
                    console.error("Voice recognition error", event.error);
                    if (event.error === 'not-allowed') {
                        alert("Microphone access blocked. Please check your browser settings.");
                    }
                };

                recognition.start();
            };

            const handleSend = async () => {
                if (!inputValue.trim() || isProcessing) return;
                const text = inputValue.trim();
                setInputValue('');
                addMessage('user', text);

                if (isVerifyingEmail) {
                    setIsProcessing(true);
                    const res = await window.Core.VerifyStudentEmail(text);
                    setIsProcessing(false);
                    if (res.status === 'success') {
                        setEmail1(text);
                        setEmail2(text);
                        setSubmission(prev => ({ ...prev, student_email: text }));
                        setIsVerifyingEmail(false);
                        setIsWaitingForOTP(true);
                        addMessage('system', "I just sent a 3-digit verification code to your email. Please enter that code below to unlock your session. \n\n*If the message is not in your Inbox, check your **Spam** or **Promotions** folder.*");
                    } else {
                        addMessage('system', "❌ Your email was not found in the roster of this class. Please verify if this is the email you used to register or if you misspelled it, and try typing your email again. If that does not work, reach out to the Registrar's Office, as you do not appear to be registered in this class. If you are, please contact Dr. Mora.");
                    }
                    return;
                }

                if (isWaitingForOTP) {
                    setIsProcessing(true);
                    const res = await window.Core.VerifyOTP(submission.student_email, text);
                    setIsProcessing(false);
                    if (res.status === 'success') {
                        setIsWaitingForOTP(false);
                        setVerificationCode(text);
                        setRoadmapData(res.completion);
                        addMessage('system', "Verification successful! Welcome back. Generating your progress roadmap...");
                        setTimeout(() => {
                            addMessage('system', '', 'roadmap');
                        }, 1000);
                    } else {
                        addMessage('system', "❌ **Invalid Code.** The verification code you entered is incorrect. Please check your email and try again.");
                    }
                    return;
                }

                if (isChoosingEditId) {
                    setIsChoosingEditId(false);
                    const id = text.trim();
                    const idx = submission.questions.findIndex(q => q.question_number.toString() === id);
                    if (idx !== -1) {
                        setIsEditing(true);
                        setCurrentQIndex(idx);
                        setReviewStep(0);
                        const qToEdit = submission.questions[idx];
                        addMessage('newton', `### Editing Question ${id}\n**Question:** ${qToEdit.question_text}\n\n**Current Agreed Response:** ${qToEdit.final_response}\n\n*Please enter your improved response below:*`);
                    } else {
                        addMessage('system', `❌ Question **${id}** not found. Please click "Edit a Response" again if you wish to try a different number.`);
                    }
                    return;
                }

                if (isWaitingForBriefing) {
                    // This block is for text-based fallback, but the button should handle it
                    setIsWaitingForBriefing(false);
                    addMessage('system', "Before we get started, I need to confirm you are registered in this class. Please tell me the email address you used to register?");
                    setIsVerifyingEmail(true);
                    return;
                }

                if (isWaitingForIntroDisclaimer) {
                    setIsWaitingForIntroDisclaimer(false);
                    runAvatarIntroductions();
                    return;
                }

                if (isWaitingForReviewStart) {
                    setIsWaitingForReviewStart(false);
                    runNextStep(0, 0, "");
                    return;
                }

                if (isWaitingForAvatarStart) {
                    setIsWaitingForAvatarStart(false);
                    // Just call runNextStep with current state to pick up where it left off
                    runNextStep(currentQIndex, reviewStep, "");
                    return;
                }

                if (isWaitingForJokerDecision) {
                    const choice = (text.toLowerCase().includes('disagree') || text.toLowerCase().includes('no') || text.toLowerCase().includes('false') || text.toLowerCase().includes('trap')) ? 'disagree' : 'agree';
                    handleJokerDecision(choice);
                    return;
                }

                if (isWaitingForCompilation) {
                    setIsWaitingForCompilation(false);
                    addMessage('system', 'Generating your report...', 'report');
                    return;
                }

                if (isWaitingForNextQuestion) {
                    setIsWaitingForNextQuestion(false);
                    setCurrentQIndex(currentQIndex + 1);
                    setReviewStep(0);
                    runNextStep(currentQIndex + 1, 0);
                    return;
                }

                if (isEditing && (text.toLowerCase().includes('yes') || text.toLowerCase().includes('report') || text.toLowerCase().includes('ok'))) {
                    // FIX: Commit the agreed model_answer to final_response before generating report
                    setSubmission(prev => {
                        const newQs = [...prev.questions];
                        const q = newQs[currentQIndex];
                        if (q && q.analysis && q.analysis.model_answer) {
                            newQs[currentQIndex] = { ...q, final_response: q.analysis.model_answer };
                        }
                        return { ...prev, questions: newQs };
                    });

                    setIsEditing(false);
                    addMessage('system', 'Generating your report...', 'report');
                    return;
                }

                if (!submission.chapter) {
                    if (suggestedChapter && ['yes', 'y', 'correct', 'sure', 'ok'].includes(text.toLowerCase())) {
                        setSuggestedChapter(null);
                        handleChapterSelected(suggestedChapter);
                        return;
                    }

                    const numMatch = text.match(/\d+/);
                    if (numMatch) {
                        setSuggestedChapter(null);
                        handleChapterSelected(numMatch[0]);
                    } else {
                        addMessage('system', "I didn't catch a valid chapter number. Please enter digits only (e.g., '1').");
                    }
                    return;
                }

                if (text.toLowerCase() === 'compile' || text.toLowerCase() === 'report') {
                    addMessage('system', 'Generating your report...', 'report');
                    return;
                }

                setLastUserInput(text); // Save for retry
                runNextStep(currentQIndex, reviewStep, text);
            };

            const generateReportData = (uCode) => {
                const content = `ISTUDY REPORT - CHAPTER ${submission.chapter}\n` +
                    `STUDENT ID: ${email1}\n` +
                    `COMPLETION CODE: ${uCode}\n` +
                    `------------------------------------------\n\n` +
                    submission.questions.map(q => `QUESTION ${q.question_number}: ${q.question_text} \nRESPONSE: ${q.final_response} \n`).join('\n---\n');
                const chNum = (submission.chapter || '0').toString().padStart(2, '0');
                const fileName = `Report_Chapter_${chNum}.txt`;
                return {
                    content,
                    uri: 'data:text/plain;charset=utf-8,' + encodeURIComponent("\ufeff" + content),
                    fileName
                };
            };

            const saveKeysToStorage = (keys) => {
                localStorage.setItem('google_api_key', JSON.stringify(keys));
                setApiKeys(keys);
                if (keys.length > 0) setApiKey(keys[0].key); // Legacy compatibility
                else setApiKey('');
            };

            const handleAddKeys = async () => {
                const inputs = [tempKey, ...extraKeys].filter(k => k && k.trim().length > 10);
                if (inputs.length === 0) {
                    setShowSettings(false);
                    return;
                }

                const newEntries = inputs.map((k, i) => ({
                    key: k.trim(),
                    label: `Account ${apiKeys.length + i + 1}`
                }));

                const newParams = [...apiKeys, ...newEntries];
                saveKeysToStorage(newParams);

                setTempKey('');
                setExtraKeys([]);

                // CLOSE MODAL AND START DISCOVERY
                setShowSettings(false);
                setIsDiscovering(true); // Trigger intelligence optimization after key save

                // AUTO-RETRY if Locked
                if (isSystemLocked && retryRequestRef.current) {
                    addMessage('system', "🔄 New key detected. Retrying previous step...");
                    setIsSystemLocked(false); // Optimistic Unlock

                    if (retryRequestRef.current.type === 'BATCH') {
                        const { transcript, questions, responses, chapterNum } = retryRequestRef.current.payload;
                        runBatchAnalysis(transcript, questions, responses, chapterNum);
                    } else if (retryRequestRef.current.type === 'CHAPTER_SELECT') {
                        const { chapterNum } = retryRequestRef.current.payload;
                        handleChapterSelected(chapterNum);
                    } else {
                        // Default to CHAT
                        runNextStep(currentQIndex, reviewStep, lastUserInput);
                    }
                }
            };

            const handleRemoveKey = (index) => {
                const newParams = apiKeys.filter((_, i) => i !== index);
                saveKeysToStorage(newParams);
            };

            // Load saved key on mount
            React.useEffect(() => {
                const raw = localStorage.getItem('google_api_key');
                if (raw) {
                    try {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            setApiKeys(parsed);
                            if (parsed.length > 0) setApiKey(parsed[0].key);
                        } else {
                            // Legacy String
                            setApiKeys([{ key: raw, label: 'Default' }]);
                            setApiKey(raw);
                        }
                    } catch {
                        setApiKeys([{ key: raw, label: 'Default' }]);
                        setApiKey(raw);
                    }
                }
            }, []);

            // Auto-scroll to bottom when new messages arrive
            const messagesEndRef = React.useRef(null);

            React.useEffect(() => {
                const scrollToBottom = () => {
                    // Using window.scrollTo(0, document.body.scrollHeight) is the most reliable
                    // way to hit the absolute bottom of a page-scrolled chat.
                    window.scrollTo({
                        top: document.documentElement.scrollHeight,
                        behavior: 'smooth'
                    });
                };

                // Trigger scroll on message update
                scrollToBottom();

                // Double-check after layout/images settle
                const timer = setTimeout(scrollToBottom, 350);
                return () => clearTimeout(timer);
            }, [messages, view]);

            const handleVideoPortalClick = () => {
                setShowVideoModal(true);
            };

            const handleRequestVideoCode = async () => {
                if (!videoCheckEmail || !videoCheckEmail.includes('@')) {
                    setVideoError("Please enter a valid student email.");
                    return;
                }
                setVideoError('');
                setIsVideoChecking(true);
                try {
                    const res = await window.Core.VerifyStudentEmail(videoCheckEmail);
                    if (res.status === 'success') {
                        setVideoStep('otp');
                    } else {
                        setVideoError(res.message || "❌ Email not found in the class roster.");
                    }
                } catch (err) {
                    setVideoError("System connection error. Please try again.");
                } finally {
                    setIsVideoChecking(false);
                }
            };

            const handleVerifyVideoOTP = async () => {
                if (!videoOtpInput || videoOtpInput.length < 3) {
                    setVideoError("Please enter the 3-digit code.");
                    return;
                }
                setVideoError('');
                setIsVideoChecking(true);
                try {
                    const res = await window.Core.VerifyOTP(videoCheckEmail, videoOtpInput);
                    if (res.status === 'success') {
                        setVerificationCode(videoOtpInput);
                        const comp = res.completion;
                        let completedCount = 0;
                        const compKeys = Object.keys(comp);
                        for (let i = 1; i <= 13; i++) {
                            const num = i;
                            const padded = i.toString().padStart(2, '0');
                            const isDone = compKeys.some(k => {
                                const lowerK = k.toLowerCase();
                                return (lowerK === `chapter ${num}` || lowerK === `chapter${num}` ||
                                    lowerK === `chapter ${padded}` || lowerK === `chapter${padded}`) &&
                                    comp[k];
                            });
                            if (isDone) completedCount++;
                        }

                        if (completedCount >= 13) {
                            setShowVideoEmailModal(false);
                            window.location.href = `video_exams.html?email=${encodeURIComponent(videoCheckEmail)}`;
                        } else {
                            setVideoError(`❌ Verification Failed: You have only completed ${completedCount} out of 13 chapters. Please finish the weekly Q&A reports first.`);
                        }
                    } else {
                        setVideoError("❌ Invalid code. Please check your email and try again.");
                    }
                } catch (err) {
                    setVideoError("System connection error. Please try again.");
                } finally {
                    setIsVideoChecking(false);
                }
            };

            return (
                <div className="app-root">
                    <header>
                        <div className="logo">IStudy <span style={{ fontSize: '0.5em', opacity: 0.6, verticalAlign: 'middle', fontWeight: 'normal' }}>2.0</span></div>
                    </header>
                    <main className="container">
                        <AnimatePresence mode="wait">
                            {view === 'landing' && (
                                <motion.div
                                    key="landing"
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, scale: 0.95 }}
                                    className="landing-content"
                                >
                                    <div className="title-image-wrapper">
                                        <video className="title-image" autoPlay loop muted playsInline onLoadedMetadata={e => { e.target.playbackRate = 0.25; }} onEnded={e => { e.target.currentTime = 0; e.target.play(); }}>
                                            <source src="GEO302.mp4" type="video/mp4" />
                                        </video>
                                    </div>

                                    <div className="landing-btn-group">
                                        <button className="main-upload-btn" onClick={handleUploadClick}>
                                            <span className="btn-icon">
                                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                    <rect x="3" y="4" width="18" height="15" rx="4" />
                                                    <circle cx="12" cy="11.5" r="3" />
                                                    <path d="M9 4L10 2H14L15 4" />
                                                </svg>
                                            </span> Upload weekly Q&A report
                                        </button>

                                        <button className="main-upload-btn" onClick={handleVideoPortalClick} title="Upload exam videos">
                                            <span className="btn-icon">
                                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                    <rect x="2" y="6" width="14" height="12" rx="3" />
                                                    <path d="M16 10l5-3v10l-5-3" />
                                                </svg>
                                            </span> Upload exam videos
                                        </button>
                                    </div>
                                </motion.div>
                            )}
                            {view === 'chat' && (
                                <motion.div
                                    key="chat"
                                    initial={{ opacity: 0 }}
                                    animate={{ opacity: 1 }}
                                    className="chat-container active"
                                    ref={chatScrollRef}
                                >
                                    <video className="title-image image-shrunken" autoPlay loop muted playsInline onLoadedMetadata={e => { e.target.playbackRate = 0.25; }} onEnded={e => { e.target.currentTime = 0; e.target.play(); }}>
                                        <source src="GEO302.mp4" type="video/mp4" />
                                    </video>
                                    <div className="messages-list">
                                        <AnimatePresence initial={false}>
                                            {messages.map((msg) => (
                                                <motion.div
                                                    key={msg.id}
                                                    initial={{ opacity: 0, y: 10, scale: 0.95 }}
                                                    animate={{ opacity: 1, y: 0, scale: 1 }}
                                                    className={`message-wrapper ${msg.isAi ? 'message-ai' : 'message-user'}`}
                                                >
                                                    <div className={`avatar ${characters[msg.charKey]?.avatarClass || ''}`}>
                                                        {!characters[msg.charKey]?.avatarClass ? (characters[msg.charKey]?.emoji || '👤') : null}
                                                    </div>
                                                    <div className="message-bubble">
                                                        {msg.type === 'report' ? (
                                                            <div className="report-chat-card">
                                                                <h3>Final Study Report - Chapter {submission.chapter}</h3>
                                                                <div className="report-list-mini">
                                                                    {submission.questions.map((q, qIdx) => (
                                                                        <div key={qIdx} className="report-item-mini">
                                                                            <p><strong>Q{q.question_number}:</strong> {q.question_text}</p>
                                                                            <p className="response-preview"><em>Response:</em> {q.final_response}</p>
                                                                        </div>
                                                                    ))}
                                                                </div>

                                                                <div className="report-actions-mini">
                                                                    <div style={{ marginBottom: '15px', color: 'var(--slate-500)', fontSize: '13px' }}>
                                                                        Verified as: <strong>{submission.student_email}</strong>
                                                                    </div>
                                                                    <button className="btn-secondary" style={{ width: '100%', marginBottom: '10px' }} onClick={() => {
                                                                        setIsChoosingEditId(true);
                                                                        addMessage('system', "Which question number would you like to edit? (Enter the digit, e.g., 1)");
                                                                    }}>Edit a Response</button>

                                                                    <button
                                                                        className={`btn-primary ${!submission.student_email ? 'disabled' : ''}`}
                                                                        style={{
                                                                            textAlign: 'center',
                                                                            display: 'block',
                                                                            width: '100%',
                                                                            boxSizing: 'border-box',
                                                                            opacity: (submission.student_email && !isSubmitting) ? 1 : 0.5,
                                                                            cursor: (submission.student_email && !isSubmitting) ? 'pointer' : 'not-allowed'
                                                                        }}
                                                                        onClick={async (e) => {
                                                                            if (!submission.student_email || isSubmitting) return;

                                                                            setIsSubmitting(true);
                                                                            setIsProcessing(true);
                                                                            addMessage('system', "Downloading your report and registering completion...");

                                                                            try {
                                                                                // Generate 17-digit unique code: 3-digit verification + YYYYMMDDHHMMSS
                                                                                const now = new Date();
                                                                                const timestamp = now.getFullYear().toString() +
                                                                                    (now.getMonth() + 1).toString().padStart(2, '0') +
                                                                                    now.getDate().toString().padStart(2, '0') +
                                                                                    now.getHours().toString().padStart(2, '0') +
                                                                                    now.getMinutes().toString().padStart(2, '0') +
                                                                                    now.getSeconds().toString().padStart(2, '0');
                                                                                const uniqueCode = (verificationCode || '000').toString().padStart(3, '0') + timestamp;

                                                                                // 1. First trigger the download manually
                                                                                const r = generateReportData(uniqueCode);
                                                                                const link = document.createElement('a');
                                                                                link.href = r.uri;
                                                                                link.download = r.fileName;
                                                                                document.body.appendChild(link);
                                                                                link.click();
                                                                                document.body.removeChild(link);

                                                                                // 2. Wait a brief moment to ensure Safari handles the download start
                                                                                await new Promise(res => setTimeout(res, 800));

                                                                                // 3. Then send the data to Google Sheets & Email
                                                                                // Calculate standing grade (Chapters + Videos)
                                                                                const gradesMap = { 1: 'F', 2: 'F', 3: 'F', 4: 'F', 5: 'D-', 6: 'D', 7: 'D+', 8: 'C-', 9: 'C', 10: 'C+', 11: 'B-', 12: 'B', 13: 'B+' };

                                                                                const padded = submission.chapter.toString().padStart(2, '0');
                                                                                const isAlreadyDone = roadmapData && (roadmapData[`Chapter ${padded}`] || roadmapData[`chapter ${padded}`] || roadmapData[`Chapter ${submission.chapter}`]);

                                                                                let chCount = Object.keys(roadmapData || {}).filter(k => k.toLowerCase().includes('chapter') && roadmapData[k]).length;
                                                                                if (!isAlreadyDone) chCount += 1;
                                                                                if (chCount > 13) chCount = 13;

                                                                                const vCount = Object.keys(roadmapData || {}).filter(k => k.toLowerCase().includes('video') && roadmapData[k]).length;

                                                                                let newGrade = gradesMap[chCount] || 'F';
                                                                                if (vCount >= 10) newGrade = 'A+';
                                                                                else if (vCount >= 8) newGrade = 'A';
                                                                                else if (vCount >= 6) newGrade = 'A-';

                                                                                const res = await window.Core.RegisterCompletion(
                                                                                    submission.student_email,
                                                                                    submission.chapter,
                                                                                    uniqueCode,
                                                                                    r.content,
                                                                                    newGrade
                                                                                );

                                                                                if (res && res.status === 'success') {
                                                                                    // Update local roadmap data so the scoreboard reflects completion immediately
                                                                                    const padded = submission.chapter.toString().padStart(2, '0');
                                                                                    setRoadmapData(prev => ({
                                                                                        ...prev,
                                                                                        [`Chapter ${padded}`]: true
                                                                                    }));

                                                                                    setView('completion');
                                                                                } else {
                                                                                    addMessage('system', "❌ **Submission Failed:** " + (res.message || "Unknown error connecting to Google Sheets."));
                                                                                }
                                                                            } catch (err) {
                                                                                console.error("Submission error:", err);
                                                                                addMessage('system', "❌ **Submission Error:** " + err.message);
                                                                            } finally {
                                                                                setIsProcessing(false);
                                                                                setIsSubmitting(false);
                                                                            }
                                                                        }}
                                                                    >
                                                                        Approve & Submit
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ) : msg.type === 'mission_briefing' ? (
                                                            <div className="mission-briefing-card">
                                                                <h2>🎯 Mission Briefing</h2>
                                                                <p className="briefing-intro-text">
                                                                    In this app, we will review your responses through three different approaches.
                                                                    <br /><br />
                                                                    I know this may feel repetitive and time-consuming (up to 60 minutes per chapter), but this is <strong>by design</strong>. To truly master a concept, you need to flex three different mental muscles:
                                                                </p>

                                                                <div className="briefing-avatars-list">
                                                                    <div className="briefing-avatar-row">
                                                                        <img src="../assets/avatar_newton.png" className="briefing-avatar-img" />
                                                                        <div className="briefing-avatar-content">
                                                                            <strong>Getting the facts right. </strong>
                                                                            For this, <strong>Newton</strong> will measure the accuracy of your responses against the lecture material.
                                                                        </div>
                                                                    </div>
                                                                    <div className="briefing-avatar-row">
                                                                        <img src="../assets/avatar_tontin.png" className="briefing-avatar-img" />
                                                                        <div className="briefing-avatar-content">
                                                                            <strong>The power of explanation. </strong>
                                                                            The best proof that you know something is when you can explain it to someone else! <strong>Tontin</strong> here is in need of some explaining.
                                                                        </div>
                                                                    </div>
                                                                    <div className="briefing-avatar-row">
                                                                        <img src="../assets/avatar_joker.png" className="briefing-avatar-img" />
                                                                        <div className="briefing-avatar-content">
                                                                            <strong>Critical Thinking. </strong>
                                                                            For this, <strong>Joker</strong> may or may not attempt to deceive you with his statements. Think critically about what he says—he may pull some tricks on you!
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <div className="briefing-result-box">
                                                                    <div className="briefing-result-item"><strong>THE RESULT:</strong> "Hack-proofed" knowledge.</div>
                                                                    <div className="briefing-result-item"><strong>THE PAYOFF:</strong> I've allocated a large fraction of the grade (<strong>up to B+</strong>) for this effort alone, significantly reducing your stress over high-stakes exams.</div>
                                                                </div>

                                                                <button id="briefing-start-btn" className="briefing-start-btn" onClick={() => {
                                                                    setIsWaitingForBriefing(false);
                                                                    addMessage('system', "Before we get started, I need to confirm you are registered in this class. Please tell me the email address you used to register?");
                                                                    setIsVerifyingEmail(true);
                                                                }}>Click to start</button>
                                                            </div>
                                                        ) : msg.type === 'roadmap' ? (
                                                            <div className="roadmap-wrapper">
                                                                <Roadmap roadmapData={roadmapData} />
                                                                <div style={{ marginTop: '20px' }}>
                                                                    <button
                                                                        className="main-upload-btn"
                                                                        style={{ fontSize: '16px', padding: '12px 24px', width: 'auto' }}
                                                                        onClick={() => fileInputRef.current.click()}
                                                                    >
                                                                        <span className="btn-icon">📂</span> Upload weekly Q&A report
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ) : msg.type === 'upload_action' ? (
                                                            <div className="action-card" style={{ textAlign: 'center', padding: '10px 0' }}>
                                                                <button
                                                                    className="main-upload-btn"
                                                                    style={{ fontSize: '16px', padding: '12px 24px', margin: '0 auto', width: 'auto' }}
                                                                    onClick={() => fileInputRef.current.click()}
                                                                >
                                                                    <span className="btn-icon">📂</span> Upload weekly Q&A report
                                                                </button>
                                                            </div>
                                                        ) : msg.type === 'reupload_action' ? (
                                                            <div className="action-card" style={{ textAlign: 'center', padding: '10px 0' }}>
                                                                <button
                                                                    className="main-upload-btn"
                                                                    style={{ fontSize: '16px', padding: '12px 24px', margin: '0 auto', width: 'auto' }}
                                                                    onClick={() => fileInputRef.current.click()}
                                                                >
                                                                    <span className="btn-icon">📂</span> Upload Corrected File
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <div className="markdown-content">
                                                                <ReactMarkdown>{msg.text}</ReactMarkdown>
                                                            </div>
                                                        )}
                                                    </div>
                                                </motion.div>
                                            ))}
                                        </AnimatePresence>
                                        {isProcessing && (
                                            <div className="message-wrapper message-ai">
                                                <div className="avatar avatar-system"></div>
                                                <div className="message-bubble">
                                                    <div className="loading-spinner"></div>
                                                </div>
                                            </div>
                                        )}
                                        <div ref={messagesEndRef} />
                                    </div>
                                </motion.div>
                            )}
                            {view === 'completion' && (
                                <motion.div
                                    key="completion"
                                    initial={{ opacity: 0 }}
                                    animate={{ opacity: 1 }}
                                    className="completion-overlay active"
                                    style={{ overflowY: 'auto', maxHeight: '100vh', padding: '20px', boxSizing: 'border-box' }}
                                >
                                    <div className="success-icon">✓</div>
                                    <h2>Chapter {submission.chapter} Complete!</h2>
                                    <p>
                                        Your <strong>revised</strong> responses have been saved to your local machine.
                                    </p>

                                    <div style={{ width: '100%', maxWidth: '600px', margin: '0 auto 40px auto', padding: '20px', background: '#f8fafc', borderRadius: '20px', border: '1px solid #e2e8f0' }}>
                                        <Roadmap roadmapData={roadmapData} />
                                    </div>

                                    <button className="btn-primary" onClick={() => window.location.reload()}>
                                        Close App
                                    </button>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>
                    <input type="file" id="fileInput" ref={fileInputRef} style={{ display: 'none' }} onChange={handleFileChange} accept="image/*,.txt,.md" />
                    {
                        view === 'chat' && (
                            <div className="input-fixed-container">
                                {isWaitingForJokerDecision ? (
                                    <div className="input-box-wrapper" style={{ display: 'flex', gap: '12px', justifyContent: 'center', padding: '10px 16px', background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '16px' }}>
                                        <button
                                            className="btn-primary"
                                            style={{
                                                flex: 1,
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                gap: '8px',
                                                padding: '12px 20px',
                                                fontSize: '15px',
                                                fontWeight: '600',
                                                background: '#16a34a',
                                                borderColor: '#16a34a',
                                                borderRadius: '10px',
                                                color: '#ffffff',
                                                cursor: isProcessing ? 'not-allowed' : 'pointer',
                                                opacity: isProcessing ? 0.6 : 1,
                                                boxShadow: '0 2px 4px rgba(22, 163, 74, 0.2)'
                                            }}
                                            onClick={() => handleJokerDecision('agree')}
                                            disabled={isProcessing}
                                        >
                                            <span style={{ fontSize: '18px' }}>👍</span> Agree
                                        </button>
                                        <button
                                            className="btn-primary"
                                            style={{
                                                flex: 1,
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                gap: '8px',
                                                padding: '12px 20px',
                                                fontSize: '15px',
                                                fontWeight: '600',
                                                background: '#dc2626',
                                                borderColor: '#dc2626',
                                                borderRadius: '10px',
                                                color: '#ffffff',
                                                cursor: isProcessing ? 'not-allowed' : 'pointer',
                                                opacity: isProcessing ? 0.6 : 1,
                                                boxShadow: '0 2px 4px rgba(220, 38, 38, 0.2)'
                                            }}
                                            onClick={() => handleJokerDecision('disagree')}
                                            disabled={isProcessing}
                                        >
                                            <span style={{ fontSize: '18px' }}>👎</span> Disagree
                                        </button>
                                    </div>
                                ) : (
                                    <div className="input-box-wrapper">
                                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                                            <textarea
                                                ref={inputRef}
                                                className="input-box"
                                                rows={1}
                                                placeholder={isProcessing ? "Processing..." : "Type your response..."}
                                                value={inputValue}
                                                onChange={(e) => {
                                                    setInputValue(e.target.value);
                                                }}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter' && !e.shiftKey) {
                                                        e.preventDefault();
                                                        handleSend();
                                                    }
                                                }}
                                                disabled={isProcessing || isSystemLocked}
                                                style={{ marginBottom: '2px' }}
                                            />
                                            <div style={{ fontSize: '0.75rem', color: '#5b6b7f', display: 'flex', alignItems: 'center', marginTop: '4px' }}>
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ marginRight: '2px' }}>
                                                    <polyline points="18 15 12 9 6 15"></polyline>
                                                </svg>
                                                <select
                                                    value={selectedModel}
                                                    onChange={(e) => {
                                                        setSelectedModel(e.target.value);
                                                        localStorage.setItem('iStudy_preferred_model', e.target.value);
                                                    }}
                                                    style={{
                                                        appearance: 'none',
                                                        border: 'none',
                                                        background: 'transparent',
                                                        color: 'inherit',
                                                        fontSize: 'inherit',
                                                        fontWeight: '400',
                                                        cursor: 'pointer',
                                                        outline: 'none',
                                                        fontFamily: 'inherit',
                                                        paddingRight: '0'
                                                    }}
                                                >
                                                    {activeChain.length > 0 ? (
                                                        activeChain.map((id, idx) => (
                                                            <option key={id} value={id}>
                                                                {id} {idx === 0 ? '(Primary Engine)' : '(Active Backup)'}
                                                            </option>
                                                        ))
                                                    ) : (
                                                        <>
                                                            <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (Primary)</option>
                                                            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Backup 1)</option>
                                                            <option value="gemma-4-26b-a4b-it">gemma-4-26b-a4b-it (Backup 2)</option>
                                                            <option value="gemma-4-31b-it">gemma-4-31b-it (Backup 3)</option>
                                                        </>
                                                    )}
                                                </select>
                                            </div>
                                        </div>
                                        <button className="action-btn" onClick={handleVoiceInput} disabled={isProcessing} title="Dictate Response">🎤</button>
                                        <button className="action-btn send-btn" onClick={handleSend} disabled={isProcessing}>➤</button>
                                    </div>
                                )}
                            </div>
                        )
                    }
                    {
                        isDiscovering && (
                            <DiscoveryOverlay
                                apiKeys={apiKeys}
                                onComplete={(newChain) => {
                                    setActiveChain(newChain);
                                    setIsDiscovering(false);
                                    if (newChain.length > 0) {
                                        setSelectedModel(newChain[0]);
                                        localStorage.setItem('iStudy_preferred_model', newChain[0]);
                                    }
                                    if (isPendingUpload) {
                                        setIsPendingUpload(false);
                                        proceedToUploadOrBriefing();
                                    }
                                }}
                            />
                        )
                    }
                    {showVideoModal && (
                        <div className="modal-overlay">
                            <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="modal-content info-modal">
                                <h3>🚀 Exam Video Phase</h3>
                                <p>The exam videos are voluntary for students aiming for a grade in the A territory (A- to A+)</p>
                                <p>To proceed with video submissions, please ensure the following:</p>
                                <ul className="modal-checklist">
                                    <li>✅ You have read the instructions about submitting your exam videos in the course website.</li>
                                    <li>✅ You have submitted all <strong>13 weekly Q&A reports</strong>.</li>
                                    <li>✅ Your videos are recorded and uploaded to YouTube (one video per chapter).</li>
                                    <li>✅ You are ready to submit your full "Exam Package" at once.</li>
                                </ul>
                                <div className="modal-actions">
                                    <button className="btn-secondary" onClick={() => setShowVideoModal(false)}>Cancel</button>
                                    <button className="btn-primary" onClick={() => {
                                        setShowVideoModal(false);
                                        setShowVideoEmailModal(true);
                                    }}>Proceed</button>
                                </div>
                            </motion.div>
                        </div>
                    )}

                    {showVideoEmailModal && (
                        <div className="modal-overlay">
                            <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="modal-content info-modal">
                                <h3>🔐 Verify Enrollment</h3>
                                {videoStep === 'email' ? (
                                    <>
                                        <p>Please enter your email address to verify your enrollment.</p>
                                        <div className="api-input-group" style={{ marginTop: '20px' }}>
                                            <input
                                                type="email"
                                                className="video-input"
                                                style={{ width: '100%', boxSizing: 'border-box' }}
                                                placeholder="your.email@hawaii.edu"
                                                value={videoCheckEmail}
                                                onChange={(e) => setVideoCheckEmail(e.target.value)}
                                            />
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <p>I just sent a <strong>3-digit verification code</strong> to <strong>{videoCheckEmail}</strong>.</p>
                                        <div className="api-input-group" style={{ marginTop: '20px' }}>
                                            <input
                                                type="text"
                                                className="video-input text-center"
                                                style={{ width: '100%', boxSizing: 'border-box', letterSpacing: '8px', fontSize: '24px', fontWeight: 'bold' }}
                                                placeholder="000"
                                                maxLength="3"
                                                value={videoOtpInput}
                                                onChange={(e) => setVideoOtpInput(e.target.value.replace(/\D/g, ''))}
                                            />
                                        </div>
                                    </>
                                )}

                                {videoError && (
                                    <div style={{ marginTop: '15px', padding: '10px', borderRadius: '8px', background: '#fee2e2', color: '#b91c1c', fontSize: '13px', border: '1px solid #fecaca' }}>
                                        {videoError}
                                    </div>
                                )}

                                <div className="modal-actions" style={{ marginTop: '30px' }}>
                                    <button className="btn-secondary" onClick={() => {
                                        setShowVideoEmailModal(false);
                                        setVideoStep('email');
                                        setVideoError('');
                                        setVideoOtpInput('');
                                    }}>Cancel</button>
                                    <button
                                        className={`btn-primary ${isVideoChecking ? 'disabled' : ''}`}
                                        disabled={isVideoChecking}
                                        onClick={videoStep === 'email' ? handleRequestVideoCode : handleVerifyVideoOTP}
                                    >
                                        {isVideoChecking ? "Processing..." : (videoStep === 'email' ? "Get Recovery Code" : "Verify & Unlock")}
                                    </button>
                                </div>
                            </motion.div>
                        </div>
                    )}
                    <footer className="landing-footer">
                        IStudy is an AI-powered essay review developed by <a href="https://github.com/Camilo-Mora" target="_blank">Camilo Mora, Ph.D.</a>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
